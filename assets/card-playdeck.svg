<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="100%" height="100%">
  <defs>
    <linearGradient id="pdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326" />
      <stop offset="100%" stop-color="#111C38" />
    </linearGradient>
    <linearGradient id="pdAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <radialGradient id="pdGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: pl 2.2s ease-in-out infinite; }
    @keyframes pl { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#pdBg)" stroke="#1E3A8A" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#pdGlow)" />
  <rect x="16" y="1.5" width="408" height="2.5" rx="1.25" fill="url(#pdAccent)" />

  <!-- Top Pill -->
  <rect x="18" y="16" width="166" height="22" rx="11" fill="#0C4A6E" stroke="#38BDF8" stroke-width="0.8" />
  <circle cx="30" cy="27" r="3.5" fill="#38BDF8" class="pulse" />
  <text x="40" y="31" class="mono" font-size="9.5" fill="#E0F2FE" font-weight="700">MODULAR PLUGIN ARCADE</text>

  <rect x="336" y="16" width="86" height="22" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="0.8" />
  <text x="379" y="30.5" text-anchor="middle" class="mono" font-size="9.5" fill="#C7D2FE" font-weight="600">22 Games</text>

  <!-- Title & Subtitle -->
  <text x="18" y="64" class="sans" font-size="20" fill="#F8FAFC" font-weight="800">🕹️ Play-Deck Arcade</text>
  <text x="220" y="63" class="mono" font-size="11" fill="#7DD3FC" font-weight="600">play-deck</text>
  <text x="18" y="84" class="sans" font-size="11.5" fill="#CBD5E1">Enterprise-grade modular web ecosystem housing 22 encapsulated</text>
  <text x="18" y="100" class="sans" font-size="11.5" fill="#CBD5E1">games with a unified <tspan fill="#38BDF8" font-weight="600">Global XP Progression Store</tspan>.</text>

  <!-- Feature Pills -->
  <rect x="18" y="112" width="96" height="24" rx="5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="0.8" />
  <text x="66" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#BAE6FD" font-weight="600">Plugin Core</text>

  <rect x="122" y="112" width="96" height="24" rx="5" fill="#1E1B4B" stroke="#818CF8" stroke-width="0.8" />
  <text x="170" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#C7D2FE" font-weight="600">Global XP</text>

  <rect x="226" y="112" width="96" height="24" rx="5" fill="#1E1B4B" stroke="#C084FC" stroke-width="0.8" />
  <text x="274" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#E9D5FF" font-weight="600">CSS Modules</text>

  <rect x="330" y="112" width="92" height="24" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="0.8" />
  <text x="376" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#A7F3D0" font-weight="600">Touch + KB</text>
</svg>
