<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 124" width="100%" height="100%">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="fbLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="25%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .glow-dot { animation: gd 2.2s ease-in-out infinite; }
    @keyframes gd { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <rect x="2" y="2" width="896" height="120" rx="14" fill="url(#fbBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="24" y="119.5" width="852" height="2.5" rx="1.25" fill="url(#fbLine)" />

  <!-- Centered Status Pill -->
  <rect x="305" y="16" width="290" height="24" rx="12" fill="#111827" stroke="#334155" stroke-width="0.9" />
  <circle cx="323" cy="28" r="4" fill="#10B981" class="glow-dot" />
  <text x="456" y="32" text-anchor="middle" class="mono" font-size="10" fill="#A7F3D0" font-weight="700">OPEN TO OPEN-SOURCE &amp; TECH COLLABORATION</text>

  <!-- Main Quote / Sign-Off -->
  <text x="450" y="68" text-anchor="middle" class="sans" font-size="15.5" fill="#F8FAFC" font-weight="700">
    Building at the intersection of Agentic AI, Product Strategy &amp; Interactive Web
  </text>
  <text x="450" y="94" text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8">
    💬 Ask me about Technology, System Design, Travel, Food &amp; Top-Tier Memes 🎃
  </text>
</svg>
