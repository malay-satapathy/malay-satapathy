<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A0D" />
      <stop offset="100%" stop-color="#271016" />
    </linearGradient>
    <linearGradient id="csAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <radialGradient id="csGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .siren { animation: sr 1.8s ease-in-out infinite; }
    @keyframes sr { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#csBg)" stroke="#7F1D1D" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#csGlow)" />
  <rect x="16" y="1.5" width="408" height="2.5" rx="1.25" fill="url(#csAccent)" />

  <!-- Top Pill -->
  <rect x="18" y="16" width="168" height="22" rx="11" fill="#450A0A" stroke="#EF4444" stroke-width="0.8" />
  <circle cx="30" cy="27" r="3.5" fill="#F87171" class="siren" />
  <text x="40" y="31" class="mono" font-size="9.5" fill="#FECACA" font-weight="700">SERVERLESS WEBRTC P2P</text>

  <rect x="328" y="16" width="94" height="22" rx="6" fill="#271016" stroke="#F59E0B" stroke-width="0.8" />
  <text x="375" y="30.5" text-anchor="middle" class="mono" font-size="9.5" fill="#FDE68A" font-weight="600">3–24+ Players</text>

  <!-- Title & Subtitle -->
  <text x="18" y="64" class="sans" font-size="20" fill="#F8FAFC" font-weight="800">🔥 Circle of Shaq</text>
  <text x="195" y="63" class="mono" font-size="11" fill="#FCA5A5" font-weight="600">Social Deduction Engine</text>
  <text x="18" y="84" class="sans" font-size="11.5" fill="#CBD5E1">Next-gen multiplayer party game engineered to solve 12 security,</text>
  <text x="18" y="100" class="sans" font-size="11.5" fill="#CBD5E1">network-leak, and gameplay loopholes in <tspan fill="#FBBF24" font-weight="600">spyfall.co</tspan>.</text>

  <!-- Feature Pills -->
  <rect x="18" y="112" width="96" height="24" rx="5" fill="#450A0A" stroke="#EF4444" stroke-width="0.8" />
  <text x="66" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#FECACA" font-weight="600">Zero-Leak API</text>

  <rect x="122" y="112" width="96" height="24" rx="5" fill="#271016" stroke="#F59E0B" stroke-width="0.8" />
  <text x="170" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#FDE68A" font-weight="600">Desi Adda Deck</text>

  <rect x="226" y="112" width="96" height="24" rx="5" fill="#271016" stroke="#EC4899" stroke-width="0.8" />
  <text x="274" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#FBCFE8" font-weight="600">Blind Voting</text>

  <rect x="330" y="112" width="92" height="24" rx="5" fill="#271016" stroke="#38BDF8" stroke-width="0.8" />
  <text x="376" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#BAE6FD" font-weight="600">PeerJS + P2P</text>
</svg>
