<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 156" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6E7681" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F87171" />
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Noto Sans, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Outer Container matching GitHub native dark canvas -->
  <rect x="1" y="1" width="858" height="154" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />

  <!-- Step 1: Epistemic Calibration -->
  <rect x="18" y="20" width="182" height="82" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
  <rect x="18" y="20" width="182" height="3" rx="1.5" fill="url(#accentPurple)" />
  <text x="32" y="42" class="mono" font-size="10.5" fill="#A78BFA" font-weight="700">01 · EPISTEMIC AUDIT</text>
  <text x="32" y="62" class="sans" font-size="13" fill="#F0F6FC" font-weight="700">[KNOWN] vs [ASSUMED]</text>
  <text x="32" y="80" class="sans" font-size="11" fill="#8B949E">Eliminate blind guesses via</text>
  <text x="32" y="94" class="sans" font-size="11" fill="#8B949E">parallel read probes first</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="200" y1="61" x2="224" y2="61" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 2: Falsification -->
  <rect x="230" y="20" width="186" height="82" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
  <rect x="230" y="20" width="186" height="3" rx="1.5" fill="url(#accentBlue)" />
  <text x="244" y="42" class="mono" font-size="10.5" fill="#38BDF8" font-weight="700">02 · FALSIFICATION</text>
  <text x="244" y="62" class="sans" font-size="13" fill="#F0F6FC" font-weight="700">Competing Hypotheses</text>
  <text x="244" y="80" class="sans" font-size="11" fill="#8B949E">Formulate 2–3 root causes &amp;</text>
  <text x="244" y="94" class="sans" font-size="11" fill="#8B949E">run fastest probe to disprove</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="416" y1="61" x2="440" y2="61" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 3: Adversarial Red-Team -->
  <rect x="446" y="20" width="186" height="82" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
  <rect x="446" y="20" width="186" height="3" rx="1.5" fill="url(#accentAmber)" />
  <text x="460" y="42" class="mono" font-size="10.5" fill="#FBBF24" font-weight="700">03 · RED-TEAM DESIGN</text>
  <text x="460" y="62" class="sans" font-size="13" fill="#F0F6FC" font-weight="700">Pre-Code Stress Test</text>
  <text x="460" y="80" class="sans" font-size="11" fill="#8B949E">Audit race conditions, state</text>
  <text x="460" y="94" class="sans" font-size="11" fill="#8B949E">locks &amp; blast radius before edit</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="632" y1="61" x2="656" y2="61" stroke="#6E7681" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 4: Closed-Loop Verification -->
  <rect x="662" y="20" width="180" height="82" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.2" />
  <rect x="662" y="20" width="180" height="3" rx="1.5" fill="url(#accentGreen)" />
  <text x="676" y="42" class="mono" font-size="10.5" fill="#34D399" font-weight="700">04 · CLOSED-LOOP</text>
  <text x="676" y="62" class="sans" font-size="13" fill="#F0F6FC" font-weight="700">Verify &amp; Ship</text>
  <text x="676" y="80" class="sans" font-size="11" fill="#8B949E">Automated test &amp; invariant</text>
  <text x="676" y="94" class="sans" font-size="11" fill="#8B949E">proof before task completion</text>

  <!-- Feedback Loop: 2-Strike Circuit Breaker -->
  <path d="M 752 102 L 752 132 L 109 132 L 109 106" fill="none" stroke="#F87171" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowRed)" />
  <rect x="275" y="119" width="310" height="24" rx="12" fill="#161B22" stroke="#F87171" stroke-width="1" stroke-opacity="0.6" />
  <text x="430" y="135" text-anchor="middle" class="mono" font-size="10.5" fill="#FCA5A5" font-weight="600">⚡ 2-Strike Circuit Breaker: Halt &amp; Re-Audit Premise</text>
</svg>
