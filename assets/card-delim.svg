<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="100%" height="100%">
  <defs>
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071518" />
      <stop offset="100%" stop-color="#0B1F24" />
    </linearGradient>
    <linearGradient id="dlAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="dlGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#dlBg)" stroke="#065F46" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#dlGlow)" />
  <rect x="16" y="1.5" width="408" height="2.5" rx="1.25" fill="url(#dlAccent)" />

  <!-- Top Pill -->
  <rect x="18" y="16" width="166" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
  <circle cx="30" cy="27" r="3.5" fill="#34D399" class="pulse" />
  <text x="40" y="31" class="mono" font-size="9.5" fill="#D1FAE5" font-weight="700">100% CLIENT-SIDE STUDIO</text>

  <rect x="332" y="16" width="90" height="22" rx="6" fill="#0F172A" stroke="#0EA5E9" stroke-width="0.8" />
  <text x="377" y="30.5" text-anchor="middle" class="mono" font-size="9.5" fill="#7DD3FC" font-weight="600">&lt;1ms Engine</text>

  <!-- Title & Subtitle -->
  <text x="18" y="64" class="sans" font-size="20" fill="#F8FAFC" font-weight="800">✨ delim</text>
  <text x="108" y="63" class="mono" font-size="11.5" fill="#34D399" font-weight="600">Zero-Touch Data Studio</text>
  <text x="18" y="84" class="sans" font-size="11.5" fill="#CBD5E1">Apple-inspired delimiter, set-diff &amp; SQL transformation studio</text>
  <text x="18" y="100" class="sans" font-size="11.5" fill="#CBD5E1">with <tspan fill="#38BDF8" font-weight="600">Natural Language Magic Wand</tspan> &amp; on-device Gemini Nano.</text>

  <!-- Feature Pills -->
  <rect x="18" y="112" width="90" height="24" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
  <text x="63" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#A7F3D0" font-weight="600">⌘K Conduit</text>

  <rect x="116" y="112" width="98" height="24" rx="5" fill="#0F172A" stroke="#06B6D4" stroke-width="0.8" />
  <text x="165" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#A5F3FC" font-weight="600">🪄 NL + Gemini</text>

  <rect x="222" y="112" width="98" height="24" rx="5" fill="#0F172A" stroke="#6366F1" stroke-width="0.8" />
  <text x="271" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#C7D2FE" font-weight="600">pandas Suite</text>

  <rect x="328" y="112" width="94" height="24" rx="5" fill="#0F172A" stroke="#F59E0B" stroke-width="0.8" />
  <text x="375" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#FDE68A" font-weight="600">SQL Dialects</text>
</svg>
