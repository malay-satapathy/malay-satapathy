  <text x="480" y="172" class="font-sans" font-size="12.5" fill="#F8FAFC" font-weight="700">02 // Full-Stack, Interactive 3D &amp; Zero-Trust Web</text>
  <text x="480" y="189" class="font-sans" font-size="11" fill="#94A3B8">React • TypeScript • Three.js / R3F • WebRTC P2P • Client-Side Studios</text>
  <rect x="480" y="197" width="386" height="6" rx="3" fill="#1E293B" />
  <rect x="480" y="197" width="356" height="6" rx="3" fill="url(#bar2)" />

  <!-- Domain 3 -->
  <text x="480" y="230" class="font-sans" font-size="12.5" fill="#F8FAFC" font-weight="700">03 // Cloud Architecture, AdTech &amp; Product Strategy</text>
  <text x="480" y="247" class="font-sans" font-size="11" fill="#94A3B8">Google Cloud • BigQuery • Enterprise Java/Spring • Growth Engineering</text>
  <rect x="480" y="255" width="386" height="6" rx="3" fill="#1E293B" />
  <rect x="480" y="255" width="374" height="6" rx="3" fill="url(#bar3)" />

  <!-- Bottom Caption inside Right Card -->
  <text x="480" y="284" class="font-mono" font-size="10.5" fill="#64748B">Bridging frontier engineering with measurable product impact</text>
</svg>
