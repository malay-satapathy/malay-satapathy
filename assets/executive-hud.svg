<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="googleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#EA4335" />
      <stop offset="66%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.65" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse {
      animation: pulseAnim 2.4s ease-in-out infinite;
    }
    .scanline {
      animation: scanAnim 6s linear infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes scanAnim {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(900px); }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#grid)" />
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#glowBlue)" />
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#glowViolet)" />

  <!-- Top Google-Inspired Multi-Color Accent Line -->
  <rect x="24" y="2" width="852" height="2.5" rx="1.25" fill="url(#googleAccent)" />

  <!-- Top Telemetry Header Bar -->
  <rect x="18" y="16" width="864" height="36" rx="8" fill="#111827" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />

  <!-- Window Traffic Lights -->
  <circle cx="36" cy="34" r="5" fill="#EF4444" />
  <circle cx="52" cy="34" r="5" fill="#F59E0B" />
  <circle cx="68" cy="34" r="5" fill="#10B981" />

  <text x="88" y="38" class="font-mono" font-size="11.5" fill="#94A3B8" font-weight="600">malay@google-india:~/executive-profile</text>

  <!-- Right Status Pill -->
  <circle cx="662" cy="34" r="4.5" fill="#10B981" class="pulse" />
  <circle cx="662" cy="34" r="8" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" class="pulse" />
  <text x="675" y="38" class="font-mono" font-size="11" fill="#E2E8F0" font-weight="600">SOLUTIONS ARCHITECT @ GOOGLE</text>

  <!-- Left Card: Executive Terminal (whoami) -->
  <rect x="18" y="64" width="432" height="238" rx="12" fill="#0B1120" fill-opacity="0.88" stroke="#1E293B" stroke-width="1.2" />
  <rect x="18" y="64" width="432" height="28" rx="12" fill="#1E293B" fill-opacity="0.45" />
  <text x="34" y="82" class="font-mono" font-size="11" fill="#60A5FA" font-weight="700">⚡ IDENTITY &amp; EXECUTIVE TELEMETRY</text>
  <text x="380" y="82" class="font-mono" font-size="10" fill="#64748B">v2026.10</text>

