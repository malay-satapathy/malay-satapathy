    <tspan fill="#10B981">❯</tspan> <tspan fill="#F8FAFC" font-weight="700">role</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#38BDF8">"Advertising Solutions Architect @ Google"</tspan>
  </text>

  <text x="34" y="139" class="font-mono" font-size="12" fill="#94A3B8">
    <tspan fill="#10B981">❯</tspan> <tspan fill="#F8FAFC" font-weight="700">pillars</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#C084FC">["Product", "Growth", "Strategy", "AI"]</tspan>
  </text>

  <text x="34" y="164" class="font-mono" font-size="12" fill="#94A3B8">
    <tspan fill="#10B981">❯</tspan> <tspan fill="#F8FAFC" font-weight="700">building</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#34D399">"System-2 AI Agents &amp; Zero-Trust Web Apps"</tspan>
  </text>

  <text x="34" y="189" class="font-mono" font-size="12" fill="#94A3B8">
    <tspan fill="#10B981">❯</tspan> <tspan fill="#F8FAFC" font-weight="700">stack</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#FBBF24">["React", "TypeScript", "Three.js", "Java", "GCP"]</tspan>
  </text>

  <text x="34" y="214" class="font-mono" font-size="12" fill="#94A3B8">
    <tspan fill="#10B981">❯</tspan> <tspan fill="#F8FAFC" font-weight="700">passions</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#F472B6">"Tech, System Design, Travel &amp; Food"</tspan>
  </text>

  <text x="34" y="239" class="font-mono" font-size="12" fill="#94A3B8">
    <tspan fill="#10B981">❯</tspan> <tspan fill="#F8FAFC" font-weight="700">constant</tspan><tspan fill="#64748B">:</tspan> <tspan fill="#A78BFA">"High-Leverage Memes 🎃 &amp; Open Source"</tspan>
  </text>

  <!-- Bottom Mini Badges inside Left Card -->
  <rect x="34" y="258" width="122" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
  <text x="95" y="275" text-anchor="middle" class="font-sans" font-size="10.5" fill="#E2E8F0" font-weight="600">🌏 Google India</text>

  <rect x="166" y="258" width="136" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
  <text x="234" y="275" text-anchor="middle" class="font-sans" font-size="10.5" fill="#E2E8F0" font-weight="600">🧠 Agentic Systems</text>

  <rect x="312" y="258" width="122" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
  <text x="373" y="275" text-anchor="middle" class="font-sans" font-size="10.5" fill="#E2E8F0" font-weight="600">✨ Creative WebGL</text>

  <!-- Right Card: Engineering & Strategy Focus Matrix -->
  <rect x="464" y="64" width="418" height="238" rx="12" fill="#0B1120" fill-opacity="0.88" stroke="#1E293B" stroke-width="1.2" />
  <rect x="464" y="64" width="418" height="28" rx="12" fill="#1E293B" fill-opacity="0.45" />
  <text x="480" y="82" class="font-mono" font-size="11" fill="#A78BFA" font-weight="700">🧭 ARCHITECTURE &amp; DOMAIN RADAR</text>
  <text x="795" y="82" class="font-mono" font-size="10" fill="#10B981">● ACTIVE</text>

  <!-- Domain 1 -->
  <text x="480" y="114" class="font-sans" font-size="12.5" fill="#F8FAFC" font-weight="700">01 // Agentic AI &amp; Meta-Cognitive Protocols</text>
  <text x="480" y="131" class="font-sans" font-size="11" fill="#94A3B8">System-2 Reasoning (MetaCog) • Epistemic Auditing • On-Device AI • MCP</text>
  <rect x="480" y="139" width="386" height="6" rx="3" fill="#1E293B" />
  <rect x="480" y="139" width="368" height="6" rx="3" fill="url(#bar1)" />

