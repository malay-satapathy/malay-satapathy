<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0B1E" />
      <stop offset="100%" stop-color="#151030" />
    </linearGradient>
    <linearGradient id="mcAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="mcGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .node-pulse { animation: np 2.2s ease-in-out infinite; }
    @keyframes np { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#mcBg)" stroke="#4C1D95" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="437" height="147" rx="12" fill="url(#mcGlow)" />
  <rect x="16" y="1.5" width="408" height="2.5" rx="1.25" fill="url(#mcAccent)" />

  <!-- Top Category Pill & Stars/License -->
  <rect x="18" y="16" width="152" height="22" rx="11" fill="#2E1065" stroke="#7C3AED" stroke-width="0.8" />
  <circle cx="30" cy="27" r="3.5" fill="#C084FC" class="node-pulse" />
  <text x="40" y="31" class="mono" font-size="9.5" fill="#E9D5FF" font-weight="700">SYSTEM-2 AI ENGINE</text>

  <rect x="348" y="16" width="74" height="22" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="0.8" />
  <text x="385" y="30.5" text-anchor="middle" class="mono" font-size="9.5" fill="#A5B4FC" font-weight="600">SKILL.md</text>

  <!-- Title & Subtitle -->
  <text x="18" y="64" class="sans" font-size="20" fill="#F8FAFC" font-weight="800">🧠 MetaCog</text>
  <text x="142" y="63" class="mono" font-size="12" fill="#A78BFA" font-weight="600">metacog</text>
  <text x="18" y="84" class="sans" font-size="11.5" fill="#CBD5E1">Upgrades AI coding agents from impulsive System-1 to</text>
  <text x="18" y="100" class="sans" font-size="11.5" fill="#CBD5E1">self-auditing <tspan fill="#F472B6" font-weight="600">System-2 Meta-Cognition</tspan>.</text>

  <!-- Mini Cognitive Loop Visualization -->
  <rect x="18" y="112" width="88" height="24" rx="5" fill="#1E1B4B" stroke="#6366F1" stroke-width="0.8" />
  <text x="62" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#C7D2FE" font-weight="600">1. Triage</text>

  <text x="113" y="127" class="mono" font-size="10" fill="#8B5CF6">→</text>

  <rect x="124" y="112" width="96" height="24" rx="5" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="0.8" />
  <text x="172" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#DDD6FE" font-weight="600">2. Epistemic</text>

  <text x="227" y="127" class="mono" font-size="10" fill="#EC4899">→</text>

  <rect x="238" y="112" width="92" height="24" rx="5" fill="#3B0764" stroke="#EC4899" stroke-width="0.8" />
  <text x="284" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#FBCFE8" font-weight="600">3. Red-Team</text>

  <text x="337" y="127" class="mono" font-size="10" fill="#38BDF8">→</text>

  <rect x="348" y="112" width="74" height="24" rx="5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="0.8" />
  <text x="385" y="127.5" text-anchor="middle" class="mono" font-size="9" fill="#BAE6FD" font-weight="600">4. Verify</text>
</svg>
